[project]
name = "google-docs-skill"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "mistune>=3.0",
    "Pillow>=10.0",
    "playwright>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
